name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Haxe Robustly
        run: |
          HAXE_VERSION=4.3.4
          curl -sL https://github.com/HaxeFoundation/haxe/releases/download/$HAXE_VERSION/haxe-$HAXE_VERSION-linux64.tar.gz -o haxe.tar.gz
          tar -xf haxe.tar.gz
          # Detecta automáticamente cualquier carpeta descomprimida de Haxe
          HAXE_DIR=$(ls -d haxe-*/ | head -n 1)
          sudo mv $HAXE_DIR /opt/haxe
          sudo ln -s /opt/haxe/haxe /usr/local/bin/haxe
          sudo ln -s /opt/haxe/haxelib /usr/local/bin/haxelib
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install Haxe Libraries
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib run lime setup -y
          haxelib run lime setup android -y

      - name: Build Android APK
        run: |
          haxelib run lime build android -final

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pibby-Engine-APK
          path: export/android/bin/app/build/outputs/apk/release/*.apk
