name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.4'

      - name: Configure Haxelib and Install Libraries
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flixel-tools

      - name: Setup Android SDK Manually
        run: |
          echo "Setting up Android SDK..."
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o android-tools.zip
          unzip -q android-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;23.1.7779620"
          
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_HOME/ndk/23.1.7779620

      - name: Verify Haxelib Setup & Path
        run: |
          haxelib setup ~/haxelib
          haxelib list

      - name: Build Android APK
        run: |
          haxelib setup ~/haxelib
          haxelib run lime build android -final

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pibby-Engine-APK
          path: export/android/bin/app/build/outputs/apk/release/*.apk
